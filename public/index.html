<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube TTS Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a090c;
    --bg-raised: #111015;
    --surface: rgba(255, 255, 255, 0.025);
    --surface-hover: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.12);

    --pink: #f3b7cf;
    --pink-soft: rgba(243, 183, 207, 0.12);
    --mint: #a9e5cc;
    --mint-soft: rgba(169, 229, 204, 0.12);
    --danger: #f19a9a;

    --text: #ece8ef;
    --text-muted: #8a8492;
    --text-faint: #5a5560;

    --radius: 8px;
    --radius-sm: 6px;
    --radius-xs: 4px;
    --font-sans: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    font-family: var(--font-sans);
    color: var(--text);
    background:
        radial-gradient(900px 500px at -10% -20%, rgba(243, 183, 207, 0.08), transparent 60%),
        radial-gradient(800px 500px at 110% 120%, rgba(169, 229, 204, 0.07), transparent 60%),
        var(--bg);
    display: grid;
    grid-template-columns: 290px 1fr;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* Fine grid texture for the gamer HUD feel, kept very faint */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

.icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ---------- Cards ---------- */

.card {
    position: relative;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01)), var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 24px 60px -30px rgba(0, 0, 0, 0.8);
}

/* HUD corner accents */
.card::before,
.card::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    pointer-events: none;
    opacity: 0.55;
}
.card::before {
    top: -1px;
    left: -1px;
    border-top: 1px solid var(--pink);
    border-left: 1px solid var(--pink);
    border-top-left-radius: var(--radius);
}
.card::after {
    bottom: -1px;
    right: -1px;
    border-bottom: 1px solid var(--mint);
    border-right: 1px solid var(--mint);
    border-bottom-right-radius: var(--radius);
}

.label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
}

/* ---------- Control panel ---------- */

.panel {
    display: flex;
    flex-direction: column;
    padding: 22px;
    gap: 22px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    color: var(--bg);
    background: linear-gradient(135deg, var(--pink), var(--mint));
    box-shadow: 0 0 24px -6px rgba(243, 183, 207, 0.5);
}
.brand-mark .icon { width: 18px; height: 18px; stroke-width: 2; }

.brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
}
.brand p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-muted);
}

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
}

.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    height: 42px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.25);
    color: var(--text-faint);
    transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
}
.input-wrap:focus-within {
    border-color: rgba(243, 183, 207, 0.45);
    box-shadow: 0 0 0 3px var(--pink-soft);
    color: var(--pink);
}

.input-wrap input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
}
.input-wrap input::placeholder { color: var(--text-faint); }

.actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
}

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
}
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: default; }

.btn-primary {
    border: none;
    color: #16121a;
    background: linear-gradient(135deg, var(--pink) 0%, #e9c6dd 50%, var(--mint) 100%);
    box-shadow: 0 8px 24px -12px rgba(243, 183, 207, 0.7);
}
.btn-primary:hover:not(:disabled) {
    box-shadow: 0 10px 30px -10px rgba(243, 183, 207, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
}
.btn-primary .icon { fill: currentColor; stroke-width: 0; width: 12px; height: 12px; }

.btn-ghost {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
}
.btn-ghost:hover:not(:disabled) {
    color: var(--danger);
    border-color: rgba(241, 154, 154, 0.35);
    background: rgba(241, 154, 154, 0.06);
}

/* ---------- Status ---------- */

.status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
}

.status-dot {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
}
.status-dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid currentColor;
    opacity: 0;
}

.status-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.status-text strong { font-size: 13px; font-weight: 600; }
.status-text span {
    font-size: 11px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status[data-state="connecting"] .status-dot { background: var(--pink); color: var(--pink); }
.status[data-state="live"] .status-dot { background: var(--mint); color: var(--mint); box-shadow: 0 0 12px var(--mint); }
.status[data-state="connecting"] .status-dot::after,
.status[data-state="live"] .status-dot::after { animation: pulse 1.8s ease-out infinite; }
.status[data-state="error"] .status-dot { background: var(--danger); }
.status[data-state="live"] { border-color: rgba(169, 229, 204, 0.2); background: var(--mint-soft); }
.status[data-state="error"] { border-color: rgba(241, 154, 154, 0.25); }

@keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: auto;
}
.stat {
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
}
.stat-value {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 600;
}
.stat:nth-child(1) .icon { color: var(--pink); }
.stat:nth-child(2) .icon { color: var(--mint); }

/* ---------- Chat ---------- */

/* User-editable chat colors (the only customizable part of the UI) */
.chat-card {
    --chat-name-a: #f3b7cf;
    --chat-name-b: #a9e5cc;
    --chat-text: #cfc9d4;
    --chat-bg: #131217;

    display: flex;
    flex-direction: column;
    min-height: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01)), var(--chat-bg);
}

.chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}
.chat-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
}
.chat-title .icon { color: var(--pink); }

.icon-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: var(--radius-xs);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-faint);
}
.icon-btn:hover,
.icon-btn[aria-expanded="true"] { color: var(--text); border-color: var(--border); background: var(--surface); }

.chat-tools { position: relative; display: flex; gap: 4px; }

.color-popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 10;
    width: 240px;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-raised);
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.color-popover[hidden] { display: none; }

.color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
}

.color-row input[type="color"] {
    width: 32px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-xs);
    background: none;
    cursor: pointer;
}
.color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

.btn-reset {
    height: 32px;
    margin-top: 4px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
}
.btn-reset:hover { color: var(--text); border-color: var(--border-strong); }

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
}

.empty {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13px;
}
.empty-icon {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
}
.empty-icon .icon { width: 22px; height: 22px; stroke-width: 1.5; }

.message {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    animation: enter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    transition: background 0.2s, border-color 0.2s;
}
.message:hover { background: var(--surface-hover); border-color: var(--border); }

@keyframes enter {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
}

.avatar {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: var(--radius-xs);
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
}
.accent-a { --accent: var(--chat-name-a); }
.accent-b { --accent: var(--chat-name-b); }

.avatar {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}

.message-body { min-width: 0; }
.message-meta { display: flex; align-items: baseline; gap: 8px; }
.message-user { font-size: 13px; font-weight: 600; color: var(--accent); }
.message-time { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-faint); }
.message-text {
    margin-top: 2px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--chat-text);
    overflow-wrap: anywhere;
}

/* Narrow windows: stack the panels */
@media (max-width: 640px) {
    body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow: auto;
        height: auto;
        min-height: 100%;
    }
    .stats { margin-top: 0; }
    .chat-card { min-height: 360px; }
}
</style>
</head>

<aside class="panel card">

    <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-mic"/></svg></div>
        <div>
            <h1>YouTube TTS</h1>
            <p>Lectura de chat en vivo</p>
        </div>
    </div>

    <div class="divider"></div>

    <div class="field">
        <label class="label" for="url">Link del live</label>
        <div class="input-wrap">
            <svg class="icon"><use href="#i-link"/></svg>
            <input id="url" placeholder="youtube.com/watch?v=..." autocomplete="off" spellcheck="false">
        </div>
    </div>

    <div class="actions">
        <button class="btn-primary" id="startBtn" onclick="startBot()">
            <svg class="icon"><use href="#i-play"/></svg>
            Conectar
        </button>
        <button class="btn-ghost" id="stopBtn" onclick="stopBot()" title="Detener">
            <svg class="icon"><use href="#i-square"/></svg>
            Detener
        </button>
    </div>

    <div class="field">
        <span class="label">Estado</span>
        <div class="status" id="status" data-state="idle">
            <span class="status-dot"></span>
            <div class="status-text">
                <strong id="statusTitle">Desconectado</strong>

            </div>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <span class="label">Mensajes</span>
            <div class="stat-value"><svg class="icon"><use href="#i-message"/></svg><span id="msgCount">0</span></div>
        </div>
        <div class="stat">
            <span class="label">Voz</span>
            <div class="stat-value"><svg class="icon"><use href="#i-volume"/></svg><span>1.3x</span></div>
        </div>
    </div>

</aside>

<main class="chat-card card">

    <header class="chat-header">
        <div class="chat-title">
            <svg class="icon"><use href="#i-radio"/></svg>
            Chat en vivo
        </div>
        <div class="chat-tools">
            <button class="icon-btn" id="colorsBtn" title="Colores del chat" aria-label="Colores del chat" aria-expanded="false" aria-controls="colorPopover">
                <svg class="icon"><use href="#i-palette"/></svg>
            </button>
            <button class="icon-btn" onclick="clearChat()" title="Limpiar chat" aria-label="Limpiar chat">
                <svg class="icon"><use href="#i-trash"/></svg>
            </button>

            <div class="color-popover" id="colorPopover" hidden>
                <span class="label">Colores del chat</span>
                <label class="color-row">Nombres (tono 1) <input type="color" data-var="--chat-name-a"></label>
                <label class="color-row">Nombres (tono 2) <input type="color" data-var="--chat-name-b"></label>
                <label class="color-row">Texto <input type="color" data-var="--chat-text"></label>
                <label class="color-row">Fondo <input type="color" data-var="--chat-bg"></label>
                <button class="btn-reset" id="resetColors">
                    <svg class="icon"><use href="#i-reset"/></svg>
                    Restablecer
                </button>
            </div>
        </div>
    </header>

    <div class="chat" id="chat"></div>

<script>
const statusEl = document.getElementById("status");
const statusTitleEl = document.getElementById("statusTitle");
const statusDetailEl = document.getElementById("statusDetail");
const chatEl = document.getElementById("chat");
const urlEl = document.getElementById("url");
const startBtn = document.getElementById("startBtn");
const msgCountEl = document.getElementById("msgCount");

const MAX_MESSAGES = 200;
let msgCount = 0;

/* STATUS */
function setStatus(state, title, detail) {
    statusEl.dataset.state = state;
    statusTitleEl.textContent = title;
    statusDetailEl.textContent = detail;
}

/* WEBSOCKET */
const ws = new WebSocket("ws://localhost:4001");

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    addMessage(data.user, data.text);
};

ws.onclose = () => {
    setStatus("error", "Sin servidor", "No hay conexión con el bot local");
};

/* START */
async function startBot() {
    const url = urlEl.value.trim();

    if (!url) {
        setStatus("error", "Falta el link", "Pega el link de un live activo");
        urlEl.focus();
        return;
    }

    setStatus("connecting", "Conectando", "Buscando el chat del live...");
    startBtn.disabled = true;

    try {
        const res = await fetch(`http://localhost:4000/start?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.success) {
            setStatus("live", "En vivo", "Leyendo mensajes nuevos");
            clearChat();
        } else {
            setStatus("error", "Error", data.error || "No se pudo conectar");
        }
    } catch (err) {
        setStatus("error", "Sin servidor", "No hay conexión con el bot local");
    } finally {
        startBtn.disabled = false;
    }
}

/* STOP */
async function stopBot() {
    try {
        await fetch("http://localhost:4000/stop");
        setStatus("idle", "Detenido", "El bot dejó de leer el chat");
    } catch (err) {
        setStatus("error", "Sin servidor", "No hay conexión con el bot local");
    }
}

urlEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") startBot();
});

/* CHAT UI */
function renderEmpty() {
    chatEl.innerHTML = `
        <div class="empty">
            <div class="empty-icon"><svg class="icon"><use href="#i-message"/></svg></div>
            Los mensajes nuevos aparecerán aquí
        </div>`;
}

function clearChat() {
    msgCount = 0;
    msgCountEl.textContent = "0";
    renderEmpty();
}

// Same user always gets the same accent
function accentFor(user) {
    let hash = 0;
    for (const ch of user) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
    return Math.abs(hash) % 2 === 0 ? "accent-a" : "accent-b";
}

function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function addMessage(user, text) {
    chatEl.querySelector(".empty")?.remove();

    const name = user || "Anónimo";
    const accent = accentFor(name);
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    // textContent everywhere: chat content is untrusted
    const msg = el("div", "message");
    const body = el("div", "message-body");
    const meta = el("div", "message-meta");

    meta.append(el("span", `message-user ${accent}`, name), el("span", "message-time", time));
    body.append(meta, el("div", "message-text", text || ""));
    msg.append(el("div", `avatar ${accent}`, name.charAt(0).toUpperCase()), body);

    chatEl.appendChild(msg);

    while (chatEl.children.length > MAX_MESSAGES) {
        chatEl.firstElementChild.remove();
    }

    msgCount++;
    msgCountEl.textContent = msgCount;
    chatEl.scrollTop = chatEl.scrollHeight;
}

/* CHAT COLORS (only the chat panel is customizable) */
const chatCard = document.querySelector(".chat-card");
const colorsBtn = document.getElementById("colorsBtn");
const colorPopover = document.getElementById("colorPopover");
const colorInputs = colorPopover.querySelectorAll("input[type=color]");
const COLORS_KEY = "chatColors";

const defaultColors = {};
colorInputs.forEach(input => {
    defaultColors[input.dataset.var] = getComputedStyle(chatCard).getPropertyValue(input.dataset.var).trim();
});

function loadColors() {
    try {
        return { ...defaultColors, ...JSON.parse(localStorage.getItem(COLORS_KEY) || "{}") };
    } catch {
        return { ...defaultColors };
    }
}

function saveColors(colors) {
    try { localStorage.setItem(COLORS_KEY, JSON.stringify(colors)); } catch {}
}

function applyColors(colors) {
    colorInputs.forEach(input => {
        const value = colors[input.dataset.var];
        chatCard.style.setProperty(input.dataset.var, value);
        input.value = value;
    });
}

let chatColors = loadColors();
applyColors(chatColors);

colorInputs.forEach(input => {
    input.addEventListener("input", () => {
        chatColors[input.dataset.var] = input.value;
        chatCard.style.setProperty(input.dataset.var, input.value);
        saveColors(chatColors);
    });
});

document.getElementById("resetColors").addEventListener("click", () => {
    chatColors = { ...defaultColors };
    applyColors(chatColors);
    try { localStorage.removeItem(COLORS_KEY); } catch {}
});

function togglePopover(open) {
    colorPopover.hidden = !open;
    colorsBtn.setAttribute("aria-expanded", String(open));
}

colorsBtn.addEventListener("click", () => togglePopover(colorPopover.hidden));

document.addEventListener("click", (e) => {
    if (!colorPopover.hidden && !e.target.closest(".chat-tools")) togglePopover(false);
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") togglePopover(false);
});

renderEmpty();
</script>
